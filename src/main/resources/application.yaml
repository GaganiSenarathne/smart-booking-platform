spring:
  application:
    name: smart-booking-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/booking_platform_db?useSSL=false
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: "your_app_password"

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


